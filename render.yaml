services:
  - type: web
    name: kcau-sda-church-website
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SMTP_USER
        value: kcausdasupport@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SMTP_PASS
        sync: false
