services:
  - type: web
    name: kcau-sda-church-website
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: kcau-sda-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATA_DIR
        value: /var/data/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: SMTP_USER
        value: kcausdasupport@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SMTP_PASS
        sync: false
